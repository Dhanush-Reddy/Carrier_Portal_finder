[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "portalfinder"
version = "0.1.0"
description = "Build a database of 1,000+ employee companies and their official career portals."
requires-python = ">=3.11"
dependencies = ["httpx>=0.27", "typer>=0.12", "selectolax>=0.3.21", "tldextract>=5.3"]

[project.optional-dependencies]
dev = ["pytest>=8", "mcp>=1.2"]
linkedin = ["mcp>=1.2"]

[project.scripts]
portalfinder = "portalfinder.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
portalfinder = ["data/*.csv"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
